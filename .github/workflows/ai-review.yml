name: AI code review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    uses: stolex1y/developer-assistant/.github/workflows/review.yml@ab0b2184789ed1a574ce0beb7a0dcaaed9e25525
    with:
      repository: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      utility_ref: ab0b2184789ed1a574ce0beb7a0dcaaed9e25525
      max_uncached_input_tokens: 30000
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
