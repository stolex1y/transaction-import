name: AI code review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: stolex1y/developer-assistant/.github/workflows/review.yml@53de8bb9f0d0a716b9194afa80fdfb925421be6d
    with:
      repository: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      utility_ref: 53de8bb9f0d0a716b9194afa80fdfb925421be6d
      max_uncached_input_tokens: 30000
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
